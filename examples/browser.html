<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>script 标签调用示例</title></head>
<body>
  <h1>DOCX → HTML / JSON</h1>
  <input id="file" type="file" accept=".docx">
  <form id="url-form"><label for="url">网络 DOCX 地址</label><input id="url" type="url" required placeholder="https://example.com/document.docx"><button>转换网络文档</button></form>
  <p id="status" role="status">请选择 DOCX 文件</p>
  <button id="save" disabled>下载 HTML</button>
  <button id="save-json" disabled>下载 JSON</button>
  <button id="save-pdf" disabled>下载 PDF</button>
  <p id="fallback" hidden></p>
  <iframe id="preview" title="文档预览" sandbox="" style="display:block;width:100%;height:75vh;border:1px solid #ddd"></iframe>
  <!-- Run npm run build first. This bundle includes ZIP/XML dependencies. -->
  <script src="../dist/docx-converter.umd.cjs"></script>
  <script>
    const fileInput = document.getElementById('file');
    const status = document.getElementById('status');
    const save = document.getElementById('save');
    const saveJson = document.getElementById('save-json');
    let html = '';
    let currentInput;
    let currentTitle = 'document.docx';
    const drawingOutput = 'png'; // 流程图默认 PNG；可改为 'svg'
    const imageHandler = {
      base64ImageSize: 512 * 1024,
      // 如需上传大图片，在这里接入自己的服务；未提供回调时仍使用 Base64。
      // async processLargeImage(fileBlob, fileSuffix, fileName) {
      //   const form = new FormData(); form.append('file', fileBlob, fileName);
      //   const response = await fetch('/api/images', { method: 'POST', body: form });
      //   if (!response.ok) throw new Error('图片上传失败');
      //   return { fileUrl: (await response.json()).file_url, fileSize: fileBlob.size, fileName };
      // },
    };
    // 自动下载可能被浏览器设置、内置容器或下载插件拦截；因此始终保留一个可手动点击的链接。
    const fallback = document.getElementById('fallback');
    function resetFallback() { fallback.replaceChildren(); fallback.hidden = true; }
    function saveBlob(blob, name, message) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = name; link.textContent = `如未自动保存，点此保存 ${name}`;
      fallback.replaceChildren(link); fallback.hidden = false;
      const anchor = document.createElement('a');
      anchor.href = url; anchor.download = name;
      document.body.append(anchor); anchor.click(); anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 600000);
      status.textContent = message;
    }
    async function convert(file, title) {
      currentInput = file; currentTitle = title;
      document.getElementById('save-pdf').disabled = true; save.disabled = true; saveJson.disabled = true; fileInput.disabled = true;
      document.getElementById('preview').srcdoc = '';
      resetFallback();
      status.textContent = '转换中…';
      try {
        const result = await DocxConverter.convertToHtml(file, { title: currentTitle, imageHandler, drawingOutput });
        html = result.html;
        document.getElementById('preview').srcdoc = html;
        status.textContent = `完成，${result.warnings.length} 条提示：` + result.warnings.map(w => w.message).join('；');
        document.getElementById('save-pdf').disabled = false; save.disabled = false; saveJson.disabled = false;
      } catch (error) { status.textContent = error.message; }
      finally { fileInput.disabled = false; }
    };
    fileInput.onchange = () => { const file = fileInput.files[0]; if (file) convert(file, file.name); };
    document.getElementById('url-form').onsubmit = event => { event.preventDefault(); convert(document.getElementById('url').value.trim(), '网络文档.docx'); };
    document.getElementById('save-pdf').onclick = async () => {
      const button = document.getElementById('save-pdf'); button.disabled = true;
      status.textContent = '正在生成 PDF…';
      try {
        const result = await DocxConverter.convertToPdf(currentInput, { title: currentTitle, imageHandler, drawingOutput });
        saveBlob(new Blob([result.bytes], { type: result.mimeType }), currentTitle.replace(/\.docx$/i, '') + '.pdf',
          `PDF 已生成（${(result.bytes.length / 1024).toFixed(0)} KB）`);
      } catch (error) { status.textContent = error.message; }
      finally { button.disabled = false; }
    };
    save.onclick = () => {
      saveBlob(new Blob([html], {type: 'text/html;charset=utf-8'}), 'document.html', 'HTML 已生成');
    };
    saveJson.onclick = async () => {
      const file = currentInput; if (!file) return;
      saveJson.disabled = true;
      try {
        const result = await DocxConverter.convertToJson(file, { title: currentTitle, imageHandler, drawingOutput });
        saveBlob(new Blob([JSON.stringify(result, null, 2)], { type: 'application/json;charset=utf-8' }),
          currentTitle.replace(/\.docx$/i, '') + '.json', 'JSON 已生成');
      } catch (error) { status.textContent = error.message; }
      finally { saveJson.disabled = false; }
    };
  </script>
</body>
</html>
