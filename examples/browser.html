<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>script 标签调用示例</title></head>
<body>
  <h1>DOCX → HTML</h1>
  <input id="file" type="file" accept=".docx">
  <p id="status" role="status">请选择 DOCX 文件</p>
  <button id="save" disabled>下载 HTML</button>
  <iframe id="preview" title="文档预览" sandbox="" style="display:block;width:100%;height:75vh;border:1px solid #ddd"></iframe>
  <!-- Run npm run build first. This bundle includes ZIP/XML dependencies. -->
  <script src="../dist/docx-html.umd.cjs"></script>
  <script>
    const fileInput = document.getElementById('file');
    const status = document.getElementById('status');
    const save = document.getElementById('save');
    let html = '';
    fileInput.onchange = async () => {
      const file = fileInput.files[0]; if (!file) return;
      save.disabled = true; fileInput.disabled = true;
      document.getElementById('preview').srcdoc = '';
      status.textContent = '转换中…';
      try {
        const result = await DocxHtml.convertDocx(file, { title: file.name });
        html = result.html;
        document.getElementById('preview').srcdoc = html;
        status.textContent = `完成，${result.warnings.length} 条提示：` + result.warnings.map(w => w.message).join('；');
        save.disabled = false;
      } catch (error) { status.textContent = error.message; }
      finally { fileInput.disabled = false; }
    };
    save.onclick = () => {
      const url = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
      const a = document.createElement('a'); a.href = url; a.download = 'document.html'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    };
  </script>
</body>
</html>
